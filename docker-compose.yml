services:
  tsa:
    container_name: tsa_container
    image: tsa-image
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DEBUG=true
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      jupyter notebook
      --allow-root
      --ip=0.0.0.0
      --port=8888
      --no-browser
